<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quiz results</title>
<style>
body{margin:0;background:#f4f1ea;color:#1f2a2e;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){body{background:#141a1c;color:#e9eeec}li{background:#1c2427!important;border-color:#2e3a3d!important}}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p{opacity:.75;margin:0 0 16px}
ul{list-style:none;padding:0;margin:0}
li{background:#fffdf8;border:1px solid #ddd6c8;border-radius:10px;padding:12px 14px;margin:10px 0}
li small{display:block;opacity:.7;margin-top:2px}
</style></head><body><div class="wrap">
<h1>Quiz results</h1>
<p id="status">Loading…</p>
<ul id="list"></ul>
</div>
<script>
(function(){
  var URL_="https://ntfy.sh/bilal-ai-quiz-e21c4d8c76bd/json?poll=1&since=12h";
  var list=document.getElementById("list"), status=document.getElementById("status");
  function load(){
    fetch(URL_,{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){
      var rows=[];
      t.split("\n").forEach(function(line){ if(!line.trim()) return; try{ var m=JSON.parse(line); if(m.event==="message") rows.push(m); }catch(e){} });
      rows.sort(function(a,b){ return b.time-a.time; });
      list.textContent="";
      rows.forEach(function(m){
        var li=document.createElement("li"), s=document.createElement("small");
        li.textContent=String(m.message||"");
        s.textContent=new Date(m.time*1000).toLocaleString();
        li.appendChild(s); list.appendChild(li);
      });
      status.textContent=(rows.length?rows.length+" submission"+(rows.length>1?"s":""):"No submissions yet")+" in the last 12 hours. Refreshes every 15 seconds.";
    }).catch(function(){ status.textContent="Results can't be reached right now. Trying again in 15 seconds."; });
  }
  load(); setInterval(load,15000);
})();
</script></body></html>
